name: Playwright Smoke Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: playwright-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-qa:
    name: Smoke (QA)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      CI: true
      BASE_URL: https://home.kornferrytalent-qa.com
      SMOKE_ENVIRONMENTS: qa
      ENV: qa
      HEADLESS: true
      KEEP_BROWSER_OPEN: false
      SCENARIO_RETRY_COUNT: 1
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_USERNAME_FALLBACK: ${{ secrets.TEST_USERNAME_FALLBACK }}
      TEST_CLIENT_NAME: ${{ secrets.TEST_CLIENT_NAME }}
      TEST_PAMS_ID: ${{ secrets.TEST_PAMS_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome

      - name: Run smoke tests (QA)
        run: npm run test:smoke

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            allure-results/
          retention-days: 14
