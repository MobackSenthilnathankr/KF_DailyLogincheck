name: Playwright Smoke Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: qa
        type: choice
        options:
          - qa
          - dev
          - stage

permissions:
  contents: read

concurrency:
  group: playwright-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'qa' }})
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      CI: true
      ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'qa' }}
      SMOKE_ENVIRONMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'qa' }}
      BASE_URL: https://home.kornferrytalent-qa.com
      BASE_URL_DEV: https://home.kornferrytalent-dev.com
      BASE_URL_STAGE: https://home.kornferrytalent-stage.com
      HEADLESS: true
      KEEP_BROWSER_OPEN: false
      SCENARIO_RETRY_COUNT: 1
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_USERNAME_FALLBACK: ${{ secrets.TEST_USERNAME_FALLBACK }}
      TEST_CLIENT_NAME: ${{ secrets.TEST_CLIENT_NAME }}
      TEST_PAMS_ID: ${{ secrets.TEST_PAMS_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-playwright
        with:
          node-version: '22'

      - name: Validate required secrets
        shell: bash
        run: node scripts/validate-ci-secrets.js

      - name: Run smoke tests
        shell: bash
        run: npm run test:smoke

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.ENV }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ env.ENV }}
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.ENV }}
          path: |
            test-results/
            allure-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Playwright Smoke Tests"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Environment | \`${{ env.ENV }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Status | \`${{ job.status }}\` |"
            echo ""
            echo "Download **playwright-report** or **allure-report** artifacts from this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"
