name: Playwright Manual E2E Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: qa
        type: choice
        options:
          - qa
          - dev
          - stage

permissions:
  contents: read

jobs:
  regression:
    name: E2E (${{ inputs.environment }})
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      CI: true
      ENV: ${{ inputs.environment }}
      SMOKE_ENVIRONMENTS: ${{ inputs.environment }}
      HEADLESS: true
      KEEP_BROWSER_OPEN: false
      SCENARIO_RETRY_COUNT: 1
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_USERNAME_FALLBACK: ${{ secrets.TEST_USERNAME_FALLBACK }}
      TEST_CLIENT_NAME: ${{ secrets.TEST_CLIENT_NAME }}
      TEST_PAMS_ID: ${{ secrets.TEST_PAMS_ID }}
      BASE_URL: https://home.kornferrytalent-qa.com
      BASE_URL_DEV: https://home.kornferrytalent-dev.com
      BASE_URL_STAGE: https://home.kornferrytalent-stage.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-playwright

      - name: Validate required secrets
        shell: bash
        run: node scripts/validate-ci-secrets.js

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-regression-${{ inputs.environment }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-regression-${{ inputs.environment }}
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-regression-${{ inputs.environment }}
          path: |
            test-results/
            allure-results/
          retention-days: 14
          if-no-files-found: warn
